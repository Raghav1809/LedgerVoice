<!DOCTYPE html>
<html lang="en" ng-app="ledgerVoiceApp">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerVoice - Voice-Powered Ledger & Accounting</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome Icons (self-hosted) -->
  <link rel="stylesheet" href="css/fontawesome.min.css">

  <!-- Custom Style -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="MainController">
  {% verbatim %}
  <!-- Component: Navigation Bar -->
  <app-navbar></app-navbar>

  <!-- Main View Container (Routed components) -->
  <main class="flex-grow-1">
    <div ng-view class="container-fluid py-4 px-md-5"></div>
  </main>

  <!-- Component: Global Toast Notifications -->
  <toast-notifications></toast-notifications>

  <!-- Footer -->
  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto no-print">
    <div class="container">
      <span>&copy; 2026 LedgerVoice &mdash; English Voice-Driven Accounting &amp; Ledger System.</span>
    </div>
  </footer>
  {% endverbatim %}

  <!-- Vendor Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App Core Module -->
  <script src="js/app.js?v=4"></script>

  <!-- Services -->
  <script src="js/services/toastService.js"></script>
  <script src="js/services/apiService.js"></script>
  <script src="js/services/voiceService.js"></script>
  <script src="js/services/transactionService.js"></script>
  <script src="js/services/customerService.js"></script>
  <script src="js/services/inventoryService.js"></script>
  <script src="js/services/itemsParser.js"></script>

  <!-- Modern Components -->
  <script src="js/components/navbar.component.js"></script>
  <script src="js/components/toastNotifications.component.js"></script>
  <script src="js/components/voiceRecorder.component.js"></script>
  <script src="js/components/itemsExtractor.component.js"></script>
  <script src="js/components/transactionReceipt.component.js"></script>
  <script src="js/components/transactionLedger.component.js"></script>

  <!-- Controllers -->
  <script src="js/controllers/VoiceInputController.js"></script>
  <script src="js/controllers/TransactionController.js"></script>
</body>

</html>
