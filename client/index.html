<!DOCTYPE html>
<html lang="en" ng-app="ledgerVoiceApp">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerVoice — Voice-Powered Ledger &amp; Accounting</title>
  <meta name="description" content="LedgerVoice: Voice-driven business accounting. Record credit, payments and sales by speaking naturally in English.">

  <!-- Google Fonts: Outfit (Display) + Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome Icons (self-hosted) -->
  <link rel="stylesheet" href="css/fontawesome.min.css">

  <!-- LedgerVoice Design System -->
  <link rel="stylesheet" href="css/style.css?v=10">
</head>

<body ng-controller="MainController">
  {% verbatim %}
  <!-- Component: Navigation Bar -->
  <app-navbar class="sticky-top"></app-navbar>

  <!-- Main View Container (Routed AngularJS components) -->
  <main class="flex-grow-1">
    <div ng-view class="container-fluid py-4 px-3 px-md-4 px-xl-5"></div>
  </main>

  <!-- Component: Global Toast Notifications -->
  <toast-notifications></toast-notifications>

  <!-- Footer -->
  <footer class="border-top py-3 text-center mt-auto no-print"
          style="background:rgba(255,255,255,0.85); backdrop-filter:blur(10px);">
    <div class="container">
      <span class="text-muted small">
        &copy; 2026 <strong>LedgerVoice</strong> &mdash;
        English Voice-Driven Accounting &amp; Ledger System
        &nbsp;&bull;&nbsp;
        <i class="fa-solid fa-shield-halved text-success"></i>
        JWT Secured
      </span>
    </div>
  </footer>
  {% endverbatim %}

  <!-- ── Vendor Scripts ─────────────────────────── -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ── App Core ───────────────────────────────── -->
  <script src="js/app.js?v=10"></script>

  <!-- ── Services ──────────────────────────────── -->
  <script src="js/services/toastService.js?v=10"></script>
  <script src="js/services/apiService.js?v=10"></script>
  <script src="js/services/authService.js?v=10"></script>
  <script src="js/services/voiceService.js?v=10"></script>
  <script src="js/services/onboardingService.js?v=10"></script>
  <script src="js/services/transactionService.js?v=10"></script>
  <script src="js/services/customerService.js?v=10"></script>
  <script src="js/services/inventoryService.js?v=10"></script>
  <script src="js/services/insightService.js?v=10"></script>
  <script src="js/services/reminderService.js?v=10"></script>
  <script src="js/services/itemsParser.js?v=10"></script>

  <!-- ── Components ────────────────────────────── -->
  <script src="js/components/navbar.component.js?v=10"></script>
  <script src="js/components/toastNotifications.component.js?v=10"></script>
  <script src="js/components/voiceRecorder.component.js?v=10"></script>
  <script src="js/components/itemsExtractor.component.js?v=10"></script>
  <script src="js/components/transactionReceipt.component.js?v=10"></script>
  <script src="js/components/transactionLedger.component.js?v=10"></script>

  <!-- ── Controllers ───────────────────────────── -->
  <script src="js/controllers/AuthController.js?v=10"></script>
  <script src="js/controllers/DashboardController.js?v=10"></script>
  <script src="js/controllers/VoiceInputController.js?v=10"></script>
  <script src="js/controllers/OnboardingController.js?v=10"></script>
  <script src="js/controllers/TransactionController.js?v=10"></script>
  <script src="js/controllers/InventoryController.js?v=10"></script>
  <script src="js/controllers/ReminderController.js?v=10"></script>
</body>

</html>
